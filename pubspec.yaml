name: base
description: "Base App"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter

    # Localizations
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # UI
  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  flutter_svg: ^2.0.17
  flutter_native_splash: ^2.4.5
  flutter_launcher_icons: ^0.14.3
  image_picker: ^1.1.2
  another_xlider: ^3.0.2
  photo_view: ^0.15.0
  lottie: ^3.3.1
  lucide_icons_flutter: ^3.1.4

  # Network
  retrofit: ^4.4.2
  dio: ^5.8.0+1
  json_annotation: ^4.9.0
  connectivity_plus: ^7.0.0

  # Logger
  awesome_dio_interceptor: ^1.3.0
  colorize: ^3.0.0

  # State management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Navigation
  go_router: ^16.2.5

  # Storage
  shared_preferences: ^2.5.2
  drift: ^2.25.0
  drift_flutter: ^0.2.4
  flutter_secure_storage: ^9.2.4
  path_provider: ^2.1.5

  # Permission
  permission_handler: ^12.0.1

  # Firebase
  firebase_core: ^4.2.0
  firebase_messaging: ^16.0.3
  flutter_local_notifications: ^19.4.2
  firebase_crashlytics: ^5.0.3

  # Utilities
  collection: ^1.18.0
  fluttertoast: ^9.0.0
  uuid: ^4.5.1
  flutter_image_compress: ^2.4.0
  cached_network_image: ^3.4.1
  smooth_page_indicator: ^1.2.0+3
  timeago: ^3.7.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  change_app_package_name: ^1.4.0
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  flutter_gen_runner: ^5.10.0
  retrofit_generator: ^10.0.0
  bloc_test: ^9.1.7
  json_serializable: ^6.9.4
  drift_dev: ^2.26.0
  theme_tailor: ^3.0.2

 

flutter_gen:
  output: lib/presentation/resources/gen
  line_length: 120

  assets:
    enabled: true

  colors:
    enabled: true
    inputs:
      - assets/colors/colors.xml
    outputs:
      class_name: AppColors
  fonts:
    enabled: true
    outputs:
      class_name: FontFamily

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/colors/
    - assets/lotties/
    - assets/sound/
    - assets/strings/

  fonts:
    - family: Itim
      fonts:
        - asset: assets/fonts/itim.ttf
          weight: 400

flutter_native_splash:
  color: "#F5F1F1"
  image: assets/images/ic_splash.png
  color_dark: "#F5F1F1"
  image_dark: assets/images/ic_splash.png

  android_12:
    color: "#F5F1F1"
    icon_background_color_dark: "#F5F1F1"
    image: assets/images/ic_splash_12.png
    image_dark: assets/images/ic_splash_12.png
    icon_background_color: "#F8F7FC"

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: assets/images/ic_splash.png
  min_sdk_android: 21
  adaptive_icon_background: "#F5F1F1"
  remove_alpha_ios: true
  adaptive_icon_foreground: assets/images/ic_splash.png
  background_color_ios: "#F5F1F1"
